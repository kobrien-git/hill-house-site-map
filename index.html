<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hill House – Site Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f6f4ef;--panel:#fffdf8;--ink:#23211c;--muted:#6b665b;--line:#e2ddd1;--accent:#7a5a2e;--y2021:#2f7fb8;--y2026:#d9822b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
#app{display:flex;height:100%}
#side{width:390px;max-width:100%;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:2}
#side header{padding:16px 18px 10px;border-bottom:1px solid var(--line)}
#side h1{font-size:19px;margin:0 0 2px;letter-spacing:.2px}
#side .sub{color:var(--muted);font-size:13px}
#tabs{display:flex;flex-wrap:wrap;gap:0;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
#tabs button{border:0;background:none;padding:7px 7px;font:inherit;font-size:13px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
#tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
#content{overflow-y:auto;padding:14px 18px 24px;flex:1}
#content h2{font-size:15px;margin:16px 0 6px}
#content h2:first-child{margin-top:0}
#content ul{padding-left:18px;margin:4px 0 10px}
#content li{margin:3px 0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;background:#efe7d8;margin:2px 4px 2px 0}
.tag.no{background:#e6efe6}
.note{background:#f3efe5;border-left:3px solid var(--accent);padding:8px 10px;font-size:13px;margin:10px 0}
.ctrl{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:10px 0}
.ctrl label{display:flex;align-items:center;gap:8px;margin:4px 0;cursor:pointer}
.ctrl input[type=range]{width:100%}
.ctrl .lbl{font-size:12px;color:var(--muted);margin-top:6px}
.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;margin:2px 4px 2px 0}
.btn:hover{border-color:var(--accent)}
.thumb{width:100%;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:middle;margin-right:4px}
#map{flex:1;height:100%}
.leaflet-popup-content{margin:10px}
.leaflet-popup-content img{display:block;max-width:300px;max-height:300px;border-radius:4px}
.pcap{font-size:12px;color:var(--muted);margin-top:4px}
#toggle{display:none}
.lc{background:var(--panel);border:2px solid var(--accent);border-radius:10px;box-shadow:0 4px 16px rgba(0,0,0,.3);font-size:13px;min-width:230px;max-height:calc(100vh - 40px);overflow-y:auto}
.lc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 12px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;user-select:none;font-size:14px}
.lc-head .chev{transition:transform .2s}
.lc.closed .chev{transform:rotate(-90deg)}
.lc.closed .lc-body{display:none}
.lc-body{padding:8px 12px 10px}
.lc-sec{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:8px 0 3px;font-weight:600}
.lc-sec:first-child{margin-top:2px}
.lc label{display:flex;align-items:center;gap:7px;margin:3px 0;cursor:pointer;color:var(--ink)}
.lc input[type=range]{width:100%}
.sw{display:inline-block;width:14px;height:3px;border-radius:2px}
@media (max-width:760px){.lc{min-width:0;max-height:45vh}}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:9999;cursor:zoom-out}
#lightbox img{max-width:95vw;max-height:92vh}
footer{font-size:11px;color:var(--muted);padding:8px 18px;border-top:1px solid var(--line)}
@media (max-width:760px){
  #app{flex-direction:column}
  #side{width:100%;height:46%;border-right:0;border-bottom:1px solid var(--line)}
  #map{height:54%}
}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <header>
      <h1>Hill House, Corracunna</h1>
      <div class="sub">Mitchelstown, Co. Cork · existing site briefing · Nov 2026</div>
    </header>
    <nav id="tabs">
      <button data-t="site" class="on">Site</button>
      <button data-t="house">Existing house</button>
      <button data-t="age">Age</button>
      <button data-t="brief">Brief</button>
      <button data-t="question">Planning</button>
    </nav>
    <div id="content"></div>
    <footer>Historic maps &amp; 2013-18 aerial: screenshots from Tailte Éireann (© Tailte Éireann / Government of Ireland), indicative only. Imagery © Esri. Basemap © OpenStreetMap contributors.</footer>
  </aside>
  <div id="map"></div>
</div>
<div id="lightbox"><img alt=""></div>

<template id="t-site">
  <h2>Location</h2>
  <ul>
    <li>Hill House, Corracunna, Mitchelstown, Co. Cork (P67 D954).</li>
    <li>Family land. Kevin's parents own the land and house and will give landowner consent. Kevin O'Brien and Felicity Peart are the applicants. It will be their family home.</li>
    <li>About 200 m down a private gated lane. Heavily screened by trees, not visible from any public road or from Scenic Route S1.</li>
  </ul>
  <h2>Designations (Cork CDP 2022-2028)</h2>
  <div><span class="tag">Mitchelstown Greenbelt GB 1-1</span><span class="tag">High Value Landscape</span><span class="tag">Blackwater SAC catchment</span></div>
  <div><span class="tag no">Not a Protected Structure</span><span class="tag no">Not in an ACA</span><span class="tag no">Not on the NIAH</span></div>
  <h2>To keep</h2>
  <ul>
    <li>Stone outbuildings and the ruin in the yard.</li>
    <li>Mature trees and field boundaries.</li>
  </ul>
  <div class="ctrl">
    <button class="btn" onclick="go('house')">Zoom to house</button>
    <button class="btn" onclick="go('site')">Zoom to farmyard</button>
    <button class="btn" onclick="go('wide')">Wider setting</button>
  </div>
</template>

<template id="t-house">
  <h2>Existing house</h2>
  <ul>
    <li>Two-storey rendered vernacular farmhouse, roughly 118 m².</li>
    <li>Hipped slate roof, with a later flat-roofed sunroom on the south side.</li>
    <li>Habitable and currently lived in (informally let).</li>
    <li>It may not have proper foundations, but nothing has been tested.</li>
  </ul>
  <h2>Measured survey</h2>
  <ul>
    <li>Jim Canning (Consulting Engineer, Cork), March 2026. A dimensioned survey of the house and outbuildings, not a structural or condition report.</li>
    <li>The drawing includes ground- and first-floor plans, a roof plan, elevations and sections.</li>
  </ul>
  <div class="note">The <b style="color:#c0392b">red</b> (ground floor) and <b style="color:#b59a00">yellow</b> (roof) outlines on the map are traced from that drawing. They were placed by eye against the 2021 drone image, so treat their position as about ±1-2 m. The .dwg itself (sent separately) has the true dimensions.</div>
  <h2>Site photos</h2>
  <p>Click any dot on the map to see the photo taken from that spot. Use the <b>Layers</b> panel (top right of the map) to switch things on and off. <span class="dot" style="background:var(--y2026)"></span>2026 drone and <span class="dot" style="background:var(--y2021)"></span>2021 drone. Hover over or open a photo to see which way the camera was pointing.</p>
</template>

<template id="t-age">
  <h2>How old is the house?</h2>
  <p>The Ordnance Survey maps suggest it was built <b>c.1900-1930</b>.</p>
  <ul>
    <li><b>OS 6-inch, 1st edition (1829-41):</b> the site is an open field.</li>
    <li><b>OS 25-inch (1888-1913):</b> still no house.</li>
    <li><b>OS 6-inch, later edition (20th C):</b> the house appears for the first time.</li>
  </ul>
  <p>This matters for planning. Because it's a later building, its heritage significance is likely to be modest, although it is still a vernacular building under the Development Plan.</p>
  <img class="thumb" src="img/Hill_House_historic_map_comparison.png" alt="Historic map comparison" onclick="lb(this.src)">
  <div class="ctrl">
    <div class="lbl">Overlay a historic map on the live map (or use the Layers panel on the map):</div>
    <button class="btn" onclick="showHist('h1')">1840s 6-inch</button>
    <button class="btn" onclick="showHist('h2')">25-inch 1888-1913</button>
    <button class="btn" onclick="showHist('h3')">Later 6-inch</button>
    <button class="btn" onclick="showHist('a1318')">Aerial 2013-18</button>
    <button class="btn" onclick="showHist(null)">None</button>
    <div class="lbl">Overlay opacity</div>
    <input type="range" min="0" max="100" value="80" oninput="setHistOpacity(this.value)">
  </div>
  <p class="note">The historic maps are screen captures georeferenced by hand, so expect a few metres of drift.</p>
</template>

<template id="t-brief">
  <h2>What we're after</h2>
  <ul>
    <li>Roughly 200-220 m². Possibly a simple two-storey block with a single-storey living wing.</li>
    <li><b>Ground floor:</b> open-plan kitchen/living/dining, playroom, drawing room, small WC, pantry and boot/utility room.</li>
    <li><b>Upstairs:</b> master suite with walk-in wardrobe, shower and double sinks. Three bedrooms, one with a small en suite. A main bathroom with bath and shower.</li>
    <li>We both work from home, so office space matters.</li>
    <li><b>Nice to have:</b> a covered terrace, good ceiling height in the living space, and big glazing to the views.</li>
    <li>A high standard of design and a very sustainable build. We'd like to reuse stone from the site where possible.</li>
  </ul>
  <h2>Background</h2>
  <p>An earlier scheme of about 295 m² came in well over budget. We're stepping back to rethink size, form and approach from scratch.</p>
</template>

<template id="t-question">
  <h2>The big question</h2>
  <p><b>Demolish and replace, or retain and extend?</b></p>
  <ul>
    <li>The house counts as vernacular, so the CDP sets a <b>presumption against demolition</b> (§16.3.20-22, HE 16-19). Demolition would need a conservation appraisal by an accredited consultant, plus a structural report.</li>
    <li>Replacing a habitable dwelling (RP 5-29) means the usual rural-housing need test and occupancy clause shouldn't apply.</li>
    <li>The greenbelt (RP 5-19/5-20) and High Value Landscape (GI 14-9/14-10) rules call for a higher design standard.</li>
    <li>Wastewater will need an on-site treatment system (RP 5-23), and the Blackwater SAC makes this a sensitive catchment.</li>
  </ul>
  <div class="note">We'd value your honest view on both routes: what each would mean for cost, structure and planning risk. That includes whether keeping part of the original house is realistic.</div>
</template>


<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="data/data.js"></script>
<script>
const S = window.SITE, P = window.PHOTOS;
const map = L.map('map', {zoomControl:true, maxZoom:22}).setView(S.centre, 19);
const base = {
  esri: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxNativeZoom:19, maxZoom:22, attribution:'Imagery © Esri, Maxar, Earthstar Geographics'}),
  osm: L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {maxNativeZoom:19, maxZoom:22, attribution:'© OpenStreetMap contributors'})
};
base.esri.addTo(map);
L.control.scale({imperial:false}).addTo(map);

const hist = {
  h1: L.imageOverlay('img/1_OS6inch_1stEd_1829-41.png', S.histBounds, {opacity:.8}),
  h2: L.imageOverlay('img/2_OS25inch_1888-1913.png', S.histBounds, {opacity:.8}),
  h3: L.imageOverlay('img/3_OS6inch_LastEd.png', S.histBounds, {opacity:.8}),
  a1318: L.imageOverlay('img/4_Aerial_2013-18.png', S.histBounds, {opacity:.8})
};
let histOn = null, histOp = .8;
function showHist(k){
  if(histOn) map.removeLayer(hist[histOn]);
  histOn = k || null;
  if(histOn){ hist[histOn].setOpacity(histOp).addTo(map); hist[histOn].bringToFront(); lay.ground.bringToFront(); lay.roof.bringToFront(); if(map.getZoom()>17) map.setZoom(17); }
  document.querySelectorAll('input[name=hist]').forEach(r=>r.checked = (r.value===(histOn||'')));
}
function setHistOpacity(v){ histOp = v/100; Object.values(hist).forEach(h=>h.setOpacity(histOp)); document.querySelectorAll('input[type=range]').forEach(r=>r.value=v); }

const lay = {
  drone: L.imageOverlay('img/drone_2021.png', S.droneBounds, {opacity:1}),
  townland: L.geoJSON(S.townland, {style:{color:'#fff', weight:2, dashArray:'6 4', fill:false}, interactive:false}),
  ground: L.geoJSON(S.ground, {style:{color:'#e0352b', weight:2.5}}).bindTooltip('Existing ground floor (survey, approx. position)', {sticky:true}),
  roof: L.geoJSON(S.roof, {style:{color:'#f2d000', weight:2}}).bindTooltip('Existing roof plan (survey, approx. position)', {sticky:true}),
  p2026: L.layerGroup(), p2021: L.layerGroup()
};

function wedge(lat, lon, yaw, len){
  const R=6378137, toLL=(dx,dy)=>[lat+dy/R*180/Math.PI, lon+dx/(R*Math.cos(lat*Math.PI/180))*180/Math.PI];
  const pts=[[lat,lon]];
  for(let a=yaw-22; a<=yaw+22; a+=11){ const r=a*Math.PI/180; pts.push(toLL(Math.sin(r)*len, Math.cos(r)*len)); }
  return pts;
}
P.forEach(p=>{
  const y = p.taken.startsWith('2026') ? 'p2026' : 'p2021';
  const col = y==='p2026' ? '#d9822b' : '#2f7fb8';
  const oblique = p.pitch!=null && p.pitch > -75 && p.yaw!=null;
  const kind = p.pitch==null ? '' : (p.pitch <= -75 ? 'looking straight down' : `looking ${compass(p.yaw)}, ${Math.round(-p.pitch)}° down`);
  const html = `<img src="${p.thumb}" alt="" onclick="lb(this.src)" style="cursor:zoom-in"><div class="pcap">${p.taken||''}${p.alt!=null?` · ${Math.round(p.alt)} m up`:''}${kind?` · ${kind}`:''}</div>`;
  const w = oblique ? L.polygon(wedge(p.lat,p.lon,p.yaw,25), {color:col, weight:1, fillOpacity:.35, interactive:false}) : null;
  const m = L.circleMarker([p.lat,p.lon], {radius:5, color:'#fff', weight:1.2, fillColor:col, fillOpacity:1})
    .bindPopup(html, {maxWidth:320, minWidth:200}).addTo(lay[y]);
  m.on('popupopen', e=>{ const i=e.popup.getElement().querySelector('img'); if(i && !i.complete) i.onload=()=>e.popup.update(); });
  if(w){ m.on('mouseover popupopen', ()=>w.addTo(map)); m.on('mouseout', ()=>{ if(!m.isPopupOpen()) map.removeLayer(w); }); m.on('popupclose', ()=>map.removeLayer(w)); }
});
function compass(d){ return ['N','NE','E','SE','S','SW','W','NW'][Math.round(((d%360)+360)%360/45)%8]; }

['drone','ground','roof','p2026','p2021'].forEach(k=>lay[k].addTo(map));

const views = { house:[S.centre,20], site:[S.centre,19], wide:[S.centre,16] };
function go(k){ map.flyTo(views[k][0], views[k][1], {duration:.8}); }

function lb(src){ const b=document.getElementById('lightbox'); b.querySelector('img').src=src; b.style.display='flex'; }
document.getElementById('lightbox').onclick = e=>e.currentTarget.style.display='none';

// tabs
const content = document.getElementById('content');
function tab(t){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
  content.innerHTML = document.getElementById('t-'+t).innerHTML;
  content.scrollTop = 0;
  if(t==='house') go('house');
  if(t==='age' && !histOn) showHist('h3');
}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.t));
const LC = L.control({position:'topright'});
LC.onAdd = function(){
  const d = L.DomUtil.create('div','lc');
  d.innerHTML = `
  <div class="lc-head"><span>&#9776;&nbsp; Layers</span><span class="chev">&#9662;</span></div>
  <div class="lc-body">
    <div class="lc-sec">Site</div>
    <label><input type="checkbox" data-l="drone"> 2021 drone image</label>
    <label><input type="checkbox" data-l="ground"> <span class="sw" style="background:#e0352b"></span>Existing ground floor</label>
    <label><input type="checkbox" data-l="roof"> <span class="sw" style="background:#f2d000"></span>Existing roof plan</label>
    <label><input type="checkbox" data-l="townland"> <span class="sw" style="background:#999"></span>Townland boundary</label>
    <div class="lc-sec">Photos</div>
    <label><input type="checkbox" data-l="p2026"> <span class="dot" style="background:var(--y2026)"></span>2026 drone</label>
    <label><input type="checkbox" data-l="p2021"> <span class="dot" style="background:var(--y2021)"></span>2021 drone</label>
    <div class="lc-sec">Historic map</div>
    <label><input type="radio" name="hist" value="" checked> None</label>
    <label><input type="radio" name="hist" value="h1"> OS 6-inch, 1829-41</label>
    <label><input type="radio" name="hist" value="h2"> OS 25-inch, 1888-1913</label>
    <label><input type="radio" name="hist" value="h3"> OS 6-inch, later ed.</label>
    <label><input type="radio" name="hist" value="a1318"> Aerial 2013-18</label>
    <div class="lc-sec">Historic map opacity</div>
    <input type="range" min="0" max="100" value="80">
    <div class="lc-sec">Background</div>
    <label><input type="radio" name="base" value="esri" checked> Satellite</label>
    <label><input type="radio" name="base" value="osm"> Street map</label>
  </div>`;
  L.DomEvent.disableClickPropagation(d); L.DomEvent.disableScrollPropagation(d);
  d.querySelector('.lc-head').onclick = ()=>d.classList.toggle('closed');
  if (window.innerWidth < 760) d.classList.add('closed');
  d.querySelectorAll('input[data-l]').forEach(cb=>{
    cb.checked = map.hasLayer(lay[cb.dataset.l]);
    cb.onchange = ()=> cb.checked ? lay[cb.dataset.l].addTo(map) : map.removeLayer(lay[cb.dataset.l]);
  });
  d.querySelectorAll('input[name=base]').forEach(r=> r.onchange = ()=>{ Object.values(base).forEach(b=>map.removeLayer(b)); base[r.value].addTo(map); });
  d.querySelectorAll('input[name=hist]').forEach(r=> r.onchange = ()=>showHist(r.value));
  d.querySelector('input[type=range]').oninput = e=>setHistOpacity(e.target.value);
  return d;
};
LC.addTo(map);
tab('site');
</script>
</body>
</html>
